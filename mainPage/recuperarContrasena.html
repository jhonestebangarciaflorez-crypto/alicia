<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALICIA - Recuperar Contraseña</title>
    <link rel="icon" type="image/png" href="../global_src/assets/img/logoHD.png">
    <link rel="stylesheet" href="src/css/recuperarContrasena.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

    <div class="brand-header">
        <div class="brand-logo-box">
            <i data-lucide="sparkles"></i>
        </div>
        <span class="brand-title">ALICIA</span>
    </div>


    <div class="login-container">
        <div class="lock-icon-container">
            <div class="lock-box">
                <i data-lucide="lock"></i>
            </div>
        </div>

        <h2>Recuperar Contraseña</h2>
        <p>Ingresa tu correo electrónico registrado y te enviaremos un código de verificación.</p>
        
        <form id="form-recuperar">
            <label class="input-label" for="correo">Correo Electrónico</label>
            <div class="input-group">
                <i data-lucide="mail"></i>
                <input type="email" id="correo" name="correo" placeholder="correo@ejemplo.com" required>
            </div>
            <button type="submit" class="btn-submit">Enviar Código</button>
        </form>

        <div id="mensaje-respuesta" style="margin-top: 15px;"></div>
        
        <div class="back-link-container">
            <a href="#">← Volver al Inicio de Sesión</a>
        </div>
    </div>
</body>
</html>
